```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>

    <!-- Link CSS File -->
    <link rel="stylesheet" href="Responsive_Image_Filter_Gallery.css">
</head>
<body>

    <!-- Header Section -->
    <header>
        <h1>Image Filter Gallery</h1>
        <p>Explore different CSS image filters</p>
    </header>

    <!-- Main Content -->
    <main>
        <section class="gallery">

            <!-- Image 1: Blur -->
            <figure class="gallery-item">
                <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=500"
                     alt="Beautiful mountain landscape"
                     class="blur">
                <figcaption>Blur Filter</figcaption>
            </figure>

            <!-- Image 2: Grayscale -->
            <figure class="gallery-item">
                <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=500"
                     alt="Lake surrounded by mountains"
                     class="grayscale">
                <figcaption>Grayscale Filter</figcaption>
            </figure>

            <!-- Image 3: Sepia -->
            <figure class="gallery-item">
                <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=500"
                     alt="Sunrise over a green field"
                     class="sepia">
                <figcaption>Sepia Filter</figcaption>
            </figure>

            <!-- Image 4: Brightness -->
            <figure class="gallery-item">
                <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=500"
                     alt="Nature landscape"
                     class="brightness">
                <figcaption>Brightness Filter</figcaption>
            </figure>

            <!-- Image 5: Contrast -->
            <figure class="gallery-item">
                <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=500"
                     alt="Sunlight passing through a forest"
                     class="contrast">
                <figcaption>Contrast Filter</figcaption>
            </figure>

            <!-- Image 6: Hue Rotate -->
            <figure class="gallery-item">
                <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=500"
                     alt="Snow-covered mountain peaks"
                     class="hue-rotate">
                <figcaption>Hue-Rotate Filter</figcaption>
            </figure>

        </section>
    </main>

    <!-- Footer Section -->
    <footer>
        <p>&copy; 2026 Image Filter Gallery</p>
    </footer>

</body>
</html>
```
