<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

```
<div class="dashboard">

    <!-- Header -->
    <header class="header">
        <h1>My Dashboard</h1>
        <p>Welcome, Nandini!</p>
    </header>

    <!-- Sidebar -->
    <aside class="sidebar">
        <h2>Navigation</h2>
        <nav>
            <a href="#dashboard">Dashboard</a>
            <a href="#analytics">Analytics</a>
            <a href="#projects">Projects</a>
            <a href="#settings">Settings</a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content" id="dashboard">

        <div class="box box1">
            <h2>Overview</h2>
            <p>Welcome to your dashboard overview.</p>
        </div>

        <div class="box box2" id="analytics">
            <h2>Analytics</h2>
            <p>Track your performance and progress.</p>
        </div>

        <div class="box box3" id="projects">
            <h2>Projects</h2>
            <p>View and manage all your projects here.</p>
        </div>

        <div class="box box4" id="settings">
            <h2>Settings</h2>
            <p>Manage your account preferences.</p>
        </div>

    </main>

</div>
```

</body>
</html>
