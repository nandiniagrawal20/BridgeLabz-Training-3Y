<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q5 - Movie Ticket Booking</title>
</head>
<body>

    <h1>Movie Ticket Booking</h1>

    <form id="bookingForm">

        <label>Name:</label>
        <input type="text" id="name" required>

        <br><br>

        <label>Email:</label>
        <input type="email" id="email" required>

        <br><br>

        <label>Seats (1-10):</label>
        <input type="number" id="seats" min="1" max="10" required>

        <br><br>

        <button type="submit">Book Ticket</button>

    </form>

    <div id="result"></div>

    <script src="Q5.js"></script>

</body>
</html>
