<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Theme Switcher</title>

    <style>
        body {
            text-align: center;
            padding: 50px;
            transition: 0.3s;
        }

        .light {
            background: white;
            color: black;
        }

        .dark {
            background: #222;
            color: white;
        }

        .blue {
            background: lightblue;
            color: darkblue;
        }
    </style>
</head>
<body class="light">

    <h1>Theme Switcher</h1>

    <button data-theme="light">Light</button>

    <button data-theme="dark">Dark</button>

    <button data-theme="blue">Blue</button>

    <p>Choose your favorite theme!</p>

    <script src="script.js"></script>

</body>
</html>
